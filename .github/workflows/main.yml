
name: Create FC27 CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests pandas

      - name: Create FC27 CSV
        env:
          FCRADAR_API_KEY: ${{ secrets.FCRADAR_API_KEY }}
        run: python make_fc27_csv.py

      - name: Save CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "EAFC27-Men(1).csv"
          git diff --cached --quiet || git commit -m "Update FC27 player data"
          git push


name: Test FC27 API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run FC27 API test
        env:
          FCRADAR_API_KEY: ${{ secrets.FCRADAR_API_KEY }}
        run: python test_fc27_api.py
